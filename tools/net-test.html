<!doctype html><meta charset="utf-8"><title>Net test</title>
<body style="font:13px monospace;background:#111;color:#ddd">
<h3>Net test (abre en 2 pestañas; sirve con python3 -m http.server)</h3>
<button id="h">Crear sala</button> <input id="c" placeholder="CODIGO"> <button id="j">Unirse</button>
<button id="l">Salir</button> <button id="r">Ready</button> <button id="k">Rol siguiente</button>
<pre id="o"></pre><pre id="log" style="height:40vh;overflow:auto"></pre>
<script src="../vendor/peerjs.min.js"></script><script src="../src/net.js"></script>
<script>
var st = { snaps: 0, inputs: 0, lastSnap: null, lastInput: null, errors: [], leaves: [], states: [] }, t0 = Date.now();
window.ST = st;
function L(m) { var e = document.getElementById('log'); e.textContent += ((Date.now() - t0) / 1000).toFixed(1) + ' ' + m + '\n'; e.scrollTop = 1e9; }
['players', 'input', 'pick', 'state', 'snapshot', 'chat', 'ready', 'leave', 'error', 'reconnecting', 'reconnected'].forEach(function (t) {
  Net.on(t, function (d, from) {
    if (t === 'snapshot') { st.snaps++; st.lastSnap = d; return; }
    if (t === 'input') { st.inputs++; st.lastInput = d; return; }
    if (t === 'error') st.errors.push(d); if (t === 'leave') st.leaves.push(d); if (t === 'state') st.states.push(d);
    L(t + ' ' + JSON.stringify(d) + ' <' + from);
  });
});
var n = 0;
setInterval(function () { // simula main.js: host emite snapshots, cliente envía input
  n++;
  if (Net.role === 'host') Net.broadcast('snapshot', { n: n, p: { p0: { x: n } } });
  else if (Net.role === 'client') Net.send('input', { left: n % 2, right: 0, jump: 0, n: n });
  document.getElementById('o').textContent = 'available=' + Net.available + ' role=' + Net.role + ' id=' + Net.localId + ' sala=' + Net.roomCode + ' rtt=' + Net.rtt + '\nsnaps=' + st.snaps + ' inputs=' + st.inputs + '\n' + (Net.link || '') + '\n' + JSON.stringify(Net.players);
}, 1000 / 60);
h.onclick = function () { Net.host({ name: 'Host' }).then(function (r) { L('sala ' + r.roomCode); }, function (e) { L('ERR ' + e.message); }); };
j.onclick = function () { Net.join(c.value, { name: 'Guest' }).then(function (r) { L('unido ' + JSON.stringify(r)); }, function (e) { L('ERR ' + e.message); }); };
l.onclick = function () { Net.leave(); };
r.onclick = function () { Net.send('ready', { ready: true }); };
k.onclick = function () { Net.setRole(['guia', 'medica', 'ing'][(['guia', 'medica', 'ing'].indexOf((Net.players.filter(function (p) { return p.id === Net.localId; })[0] || {}).role) + 1) % 3]); };
if (Net.codeFromHash()) { c.value = Net.codeFromHash(); }
</script>
