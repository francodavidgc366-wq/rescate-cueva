<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>ui-test v3</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#000;height:100%}#dev{position:fixed;left:0;bottom:0;z-index:99999;display:flex;flex-wrap:wrap;gap:2px;max-width:70vw;font:10px monospace}#dev button{font:10px monospace;padding:1px 3px;opacity:.7}#log{position:fixed;right:0;top:0;z-index:99999;font:9px monospace;color:#0f0;background:#000a;max-width:30vw;pointer-events:none}</style></head>
<body>
<script>
// ?real=1 usa assets.js (y story.js si existe v3) reales; ?go=menu|tutorial|tutN|lobby|intro|rescate|role|final|finalD|ach|settings|credits ; dev0=1 oculta la barra
const Q = new URLSearchParams(location.search), real = Q.has('real');
if (real) document.write('<script src="../src/assets.js"><\/script>');
</script>
<script>
if (!real) window.ASSETS = { images: {}, meta: {}, credits: ['Prueba sin assets: se ve el fallback procedural.'] };
window.SFX = [];
window.Sound = { sfx: (n) => { SFX.push(n); const l = document.getElementById('log'); if (l) l.textContent = SFX.slice(-8).join(' '); }, music: t => SFX.push('music:' + t), unlock() { }, speak() { }, stopSpeak() { }, setVol() { }, mute() { }, state: () => ({}) };
window.Net = window.Net || { localId: 'p0', players: [{ id: 'p0', name: 'Tu', role: 'guia', host: true }, { id: 'p1', name: 'Marta', role: 'medica' }], host: () => Promise.resolve({ roomCode: 'LUNA7', link: location.origin + location.pathname + '#sala=LUNA7' }), join: c => Promise.resolve({ id: 'p1', roomCode: c, role: 'medica' }), on() { }, off() { }, send() { }, leave() { }, setRole() { } };
</script>
<div id="log"></div>
<script src="../src/ui.js"></script>
<script>
['solo', 'host', 'join', 'start', 'restart', 'menu', 'settings', 'role', 'tutorial'].forEach(e => UI.on(e, d => console.log('ev', e, JSON.stringify(d))));
const PRIV = { goal: { text: 'Que la salud de Lia acabe en 50 o mas.', points: 30 }, secret: { text: 'Por radio oyes a Lia respirar mal: puede haber lesion interna.' } };
const FIN = { grade: 'A', saved: true, score: { total: 840, equipo: 300, info: 180, honestidad: 220, riesgo: 140 }, objectives: [{ role: 'guia', ok: true, text: 'Confianza 62/50' }, { role: 'medica', ok: false, text: 'Salud 41/50' }, { role: 'ing', ok: true, text: 'Material 48/30' }], mvp: { role: 'medica', why: 'Compartio todo y salvo a Lia.' }, achievements: ['confesion', 'cartografo', 'detective'], stats: { rounds: 5, hallazgos: 3, mentiras: 2, descubiertas: 1 }, verdict: 'Salisteis a duras penas. Lia respira, el equipo esta tocado, pero vivo: lo que callo Nico pesara entre vosotros.' };
const T = {
  menu: () => UI.showMenu(), tutorial: () => UI.showTutorial(), lobby: () => UI.showLobby({ mode: 'idle' }), lobbyhost: () => UI.showLobby({ mode: 'host' }),
  intro: () => UI.playCinematic('intro').then(() => console.log('intro done')), rescate: () => UI.playCinematic('rescate'), derrota: () => UI.playCinematic('derrota'),
  role: () => UI.showRole(PRIV, 'medica').then(() => console.log('role ok')),
  final: () => UI.showFinal(FIN), finalD: () => UI.showFinal(Object.assign({}, FIN, { grade: 'D', saved: false, achievements: [] })), ach: () => UI.showAchievements(), settings: () => { UI.showMenu(); UI.openSettings(); }, credits: () => UI.showCredits()
};
UI.on('tutorial', () => console.log('tutorial done'));
if (!Q.has('dev0')) { const d = document.createElement('div'); d.id = 'dev'; Object.keys(T).forEach(k => { const b = document.createElement('button'); b.textContent = k; b.onclick = () => T[k](); d.appendChild(b); }); document.body.appendChild(d); }
window.T = T; window.TUT = n => { UI.showTutorial(); window.__tn = n; };
const go = Q.get('go') || 'menu'; T[go]();
</script></body></html>
