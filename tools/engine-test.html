<script>
var state={round:1,players:{guia:{ap:99,name:'Nico'},medica:{ap:99,name:'Dra. Ona'},ing:{ap:99,name:'Ivan'}}};
var log=[],ICON=['mapa','caja','radio','secreto','lampara','llave'],LAB=['Examinar mapa','Abrir caja','Escuchar radio','Hallazgo oculto','Lampara','Llave'];
var T=window.T={state:state,log:log,sfx:[],drown:[],gates:[],unreach:[]};
var inst=Engine.create(document.getElementById('c'),{assets:window.ASSETS,getState:function(){return state},localRole:'guia',
  onInteract:function(role,id){log.push(role+':'+id);if(/^p\d/.test(id)){inst.markPoi(id,{used:true,by:role})}},
  onSfx:function(n,r){var b=n==='jump'&&inst.bodies[r];T.sfx.push({n:n,r:r,t:inst.tick,x:b?b.x:0,y:b?b.y:0})},onUnreachable:function(r,id){T.unreach.push(r+':'+id)},onDrown:function(r){T.drown.push(r+'@'+inst.tick+' '+(inst.bodies[r].x/16|0)+','+(inst.bodies[r].y/16|0)+' w'+Math.round(inst.water))},onGate:function(r,id,k){T.gates.push(r+':'+id+':'+k)}});
T.inst=inst;
// lista de POI de una zona: 6 slots; los de puerta llevan gate (su slot esta detras de la puerta)
T.pois=function(z){var gs=inst.getGates().filter(function(g){return g.zone===z}),used={},l=[];gs.forEach(function(g){used[g.slot]=1;l.push({id:'p'+z+'g'+g.slot,gate:g.id,label:LAB[g.slot],icon:ICON[g.slot],kind:'info'})});
  for(var i=0;i<6;i++)if(!used[i]&&!gs.some(function(g){return g.slot===i}))l.push({id:'p'+z+'_'+i,slot:i,label:LAB[i],icon:ICON[i],kind:i==3?'secreto':'info'});return l};
T.round=function(r){state.round=r;inst.setUnlocked(r);inst.gather(r);inst.setPois(r,T.pois(r))};
T.setRole=function(r){inst.setLocal(r)};
T.openAll=function(){inst.getGates().forEach(function(g){inst.openGate(g.id,true)})};
T.run=function(n){for(var i=0;i<n;i++)inst.step()};
T.unlockAll=function(){inst.setUnlocked(5)};
// alcanzabilidad: con TODAS las puertas abiertas, cada rol llega a pie a los 6 POI de las 5 zonas desde el spawn de la zona
T.reach=function(maxSec,water){maxSec=maxSec||60;var res=[],fails=0,tot=0;inst.stop();inst.resetGates();T.openAll();inst.setUnlocked(5);inst.setWater(water||5);inst.setWaterRate(0);for(var k=0;k<900;k++)inst.step();
  ['guia','medica','ing'].forEach(function(role){inst.setLocal('guia');[1,2,3,4,5].forEach(function(z){
    ['guia','medica','ing'].forEach(function(x){inst.setBot(x,x===role)});
    state.round=z;inst.gather(z);inst.setPois(z,T.pois(z));
    Object.keys(inst.pois).forEach(function(id){var p=inst.pois[id];inst.gather(z);inst.bodies[role].air=100;inst.markPoi(id,{used:false});p.disc=true;var t0=inst.tick,ok=inst.botGoto(role,id),done=false,n0=log.length;tot++;
      for(var k=0;k<maxSec*60&&ok&&!done;k++){inst.step();for(var q=n0;q<log.length;q++)if(log[q]===role+':'+id)done=true}
      if(!done)fails++;var bb=inst.bodies[role];res.push((done?'OK ':'FAIL ')+role+' z'+z+' s'+p.slot+' '+id+' '+((inst.tick-t0)/60).toFixed(1)+'s'+(ok?'':' (sin ruta)')+(done?'':' @'+(bb.x/16|0)+','+(bb.y/16|0)))})})});
  inst.start();return{total:tot,fails:fails,warps:inst.stats.warps,max:Math.max.apply(null,res.map(function(r){return +(r.match(/ ([\d.]+)s/)||[0,0])[1]})),fail:res.filter(function(r){return r[0]==='F'}),res:res}};
// v6: por rol, con solo las puertas de ESE rol abiertas y agua w (%): cada POI no tras puerta ajena (y 'lia' si hay puente) se alcanza desde el spawn; mide nado continuo max y aire minimo
T.reachRole=function(w,maxSec){maxSec=maxSec||60;var res=[],fails=0,tot=0,maxSwim=0,minAir=100;inst.stop();inst.setUnlocked(5);inst.setWaterRate(0);
  ['guia','medica','ing'].forEach(function(role){inst.resetGates();inst.getGates().forEach(function(g){if(g.role===role)inst.openGate(g.id,true)});inst.setLocal('guia');
    [1,2,3,4,5].forEach(function(z){['guia','medica','ing'].forEach(function(x){inst.setBot(x,x===role)});state.round=z;inst.gather(z);inst.setPois(z,T.pois(z));inst.setWater(w);for(var k=0;k<900;k++)inst.step();
      var targets=Object.keys(inst.pois).map(function(id){return{id:id,p:inst.pois[id]}}).filter(function(o){return !o.p.gate||inst.getGates().filter(function(g){return g.id===o.p.gate})[0].role===role});
      if(z===5&&role==='ing')targets.push({id:'lia',p:{x:inst.world.lia.x,y:inst.world.lia.y}});
      targets.forEach(function(o){inst.gather(z);var b=inst.bodies[role];b.air=100;o.p.disc=true;if(inst.pois[o.id])inst.markPoi(o.id,{used:false});var ok=o.id==='lia'?inst.botGoto(role,{x:o.p.x,y:o.p.y}):inst.botGoto(role,o.id),done=false,n0=log.length,sw=0,t0=inst.tick;tot++;
        for(var k=0;k<maxSec*60&&ok&&!done;k++){inst.step();if(o.id==='lia'){if(Math.abs(b.x-o.p.x)<20&&Math.abs(b.y-o.p.y)<20)done=true}else for(var q=n0;q<log.length;q++)if(log[q]===role+':'+o.id)done=true;if(b.air<100&&b.swim){sw++;maxSwim=Math.max(maxSwim,sw)}else sw=0;minAir=Math.min(minAir,b.air)}
        if(!done){fails++;res.push('FAIL '+role+' z'+z+' '+o.id+(ok?' @'+(b.x/16|0)+','+(b.y/16|0):' (sin ruta)'))}})})});
  inst.resetGates();inst.start();return{w:w,total:tot,fails:fails,maxSwimSec:+(maxSwim/60).toFixed(1),minAir:Math.round(minAir),fail:res}};
// v6: objetivo inalcanzable (puerta cerrada): tras 2 intentos fallidos avisa onUnreachable(role,poiId) y el bot no entra en bucle
T.unreachTest=function(){inst.stop();inst.resetGates();inst.setUnlocked(5);T.round(5);inst.setWater(5);T.unreach.length=0;inst.setBot('ing',true);var pid=Object.keys(inst.pois).filter(function(id){return inst.pois[id].gate==='z5_puente'})[0];
  var r1=inst.botGoto('ing',pid),r2=inst.botGoto('ing',pid);return new Promise(function(res){setTimeout(function(){var st=inst.stats.loops;inst.start();res({poi:pid,r1:r1,r2:r2,notified:T.unreach.slice()})},50)})};
// v6: correr: x1.6 con run; polvo
T.runTest=function(){inst.stop();T.round(1);['medica','ing'].forEach(function(x){inst.setBot(x,false)});inst.setLocal('guia');var b=inst.bodies.guia;b.x=300;b.y=35*16;b.vx=0;var o={};[false,true].forEach(function(run){b.x=300;b.vx=0;for(var k=0;k<20;k++){inst.setInput('guia',{right:true,run:run});inst.step()}var x0=b.x;for(var k=0;k<60;k++){inst.setInput('guia',{right:true,run:run});inst.step()}o[run?'run':'walk']=+(b.x-x0).toFixed(1)});
  inst.setInput('guia',{});inst.start();return o};
// puertas: cada puerta cerrada es alcanzable por el bot de su rol, el POI de detras NO lo es hasta abrir, y tras abrir si
T.gatesTest=function(){var out=[],bad=0;inst.stop();inst.setWater(5);inst.setWaterRate(0);
  inst.getGates().forEach(function(g){inst.resetGates();inst.setUnlocked(5);var z=g.zone;state.round=z;inst.gather(z);inst.setPois(z,T.pois(z));['guia','medica','ing'].forEach(function(x){inst.setBot(x,true)});
    var pid=Object.keys(inst.pois).filter(function(id){return inst.pois[id].gate===g.id})[0],role=g.role,r={id:g.id,role:role,slot:g.slot,poi:pid};
    var blockedBefore=!inst.botGoto(role,pid);r.blockedBefore=blockedBefore;
    var other=['guia','medica','ing'].filter(function(x){return x!==role})[0];r.wrongRole=!inst.botOpenGate(other,g.id);
    var cbv=null,ok=inst.botOpenGate(role,g.id,function(v){cbv=v});r.route=ok;var t0=inst.tick;
    for(var k=0;k<90*60&&ok&&!inst.getGates().filter(function(q){return q.id===g.id})[0].open;k++)inst.step();
    r.openS=((inst.tick-t0)/60).toFixed(1);for(var k2=0;k2<200;k2++)inst.step();r.open=inst.getGates().filter(function(q){return q.id===g.id})[0].open;r.cbf=function(){return cbv};
    inst.gather(z);r.reachAfter=inst.botGoto(role,pid)&&true;var done=false,n0=log.length;for(var k3=0;k3<90*60&&r.reachAfter&&!done;k3++){inst.step();for(var q=n0;q<log.length;q++)if(log[q]===role+':'+pid)done=true}r.arrived=done;
    out.push(r)});
  return new Promise(function(res){setTimeout(function(){out.forEach(function(r){r.cb=r.cbf();delete r.cbf;r.ok=r.blockedBefore&&r.wrongRole&&r.route&&r.open&&r.cb===true&&r.arrived;if(!r.ok)bad++});inst.resetGates();inst.start();res({bad:bad,out:out})},100)})};
// 5 min de bots (todos IA): sin atascos >10 s, sin saltos en bucle; el agua sube y baja; las puertas se abren/cierran
T.soak=function(minutes){minutes=minutes||5;inst.stop();inst.resetGates();inst.setUnlocked(5);var tot=minutes*3600,w0=inst.stats.warps,l0=inst.stats.loops,still={},last={},lastT={},maxStill=0,stillWho='',jumps={guia:[],medica:[],ing:[]},loops=0,minZ={};
  ['guia','medica','ing'].forEach(function(x){inst.setBot(x,true)});T.sfx.length=0;T.drown.length=0;inst.setWaterRate(0);
  var air0=0,airMin=100;
  for(var k=0;k<tot;k++){
    if(k%1800===0){var z=(k/1800|0)%5+1;state.round=z;inst.gather(z);inst.setPois(z,T.pois(z));inst.setWater([10,30,55,25,70][(k/1800|0)%5]);}
    if(k%900===300){inst.getGates().forEach(function(g){if(g.zone===(k/1800|0)%5+1&&!g.open)inst.botOpenGate(g.role,g.id)})}
    if(k%600===0)['guia','medica','ing'].forEach(function(x,i){var ids=Object.keys(inst.pois);if(ids.length&&(k/600|0)%3===i)inst.botGoto(x,ids[(k/600|0)%ids.length])});
    inst.step();
    if(k%30===0)['guia','medica','ing'].forEach(function(x){var b=inst.bodies[x];var mv=last[x]===undefined||Math.abs(b.x-last[x])>=1||Math.abs(b.y-lastT[x])>=1;still[x]=mv?0:(still[x]||0)+30;last[x]=b.x;lastT[x]=b.y;if(still[x]>maxStill){maxStill=still[x];stillWho=x+'@'+(b.x/16|0)+','+(b.y/16|0)+' k='+k+' swim='+b.swim+' goal='+(b.goal?(b.goal.gate?'gate':b.goal.poi?'poi':'w'):'none')+' air='+Math.round(b.air)+' calm='+b.calm+' busy='+b.busy+' water='+inst.water.toFixed(0)+' mac='+!!b.mac+' grounded='+b.grounded+' cur='+inst.curNode(b)+' xy='+b.x.toFixed(1)+','+b.y.toFixed(1)+' idleT='+b.idleT+' tile='+inst.tileAt(Math.floor(b.x/16),Math.round(b.y/16))+inst.tileAt(Math.floor(b.x/16),Math.round(b.y/16)-1)}airMin=Math.min(airMin,b.air)})}
  // saltos: sfx 'jump' en tierra (los de natacion son 'swim'); bucle = >=8 saltos en 5 s con <1.5 tiles de desplazamiento
  T.sfx.filter(function(e){return e.n==='jump'}).forEach(function(e){jumps[e.r].push(e)});
  var maxJ=0,jw='',loops=0,loopEv=[];['guia','medica','ing'].forEach(function(x){var a=jumps[x];for(var i=0;i<a.length;i++){var c=0,xa=1e9,xb=-1e9,ya=1e9,yb=-1e9;for(var j=i;j<a.length&&a[j].t-a[i].t<300;j++){c++;xa=Math.min(xa,a[j].x);xb=Math.max(xb,a[j].x);ya=Math.min(ya,a[j].y);yb=Math.max(yb,a[j].y)}var dd=Math.max(xb-xa,yb-ya);if(c>=7&&xb-xa<=40&&yb-ya<=32){loops++;if(loopEv.length<3)loopEv.push(x+' '+a.slice(i,j).map(function(q){return q.t+':'+(q.x/16).toFixed(1)+','+(q.y/16).toFixed(1)}).join(' '))}if(c>maxJ){maxJ=c;jw=x+' t='+a[i].t+' disp='+Math.round(dd)}}});
  inst.start();return{warps:inst.stats.warps-w0,loopsDetected:inst.stats.loops-l0,maxStillSec:maxStill/60,stillWho:stillWho,maxJumpsIn5s:maxJ,jumpWho:jw,jumpLoops:loops,loopEv:loopEv,interacts:inst.stats.interacts,lastLoop:inst.stats.lastLoop,drowns:T.drown.length,airMin:airMin}};
T.airTest=function(){inst.stop();inst.setUnlocked(5);inst.gather(5);inst.setWater(100);inst.setWaterRate(0);for(var k=0;k<2000;k++)inst.step();var b=inst.bodies.guia;
  ['guia','medica','ing'].forEach(function(x){inst.setBot(x,false)});b.x=440*16+8;b.y=35*16;b.vx=b.vy=0;b.air=100;T.drown.length=0;T.sfx.length=0;var a=[];
  for(var s=0;s<30;s++){for(var k=0;k<60;k++)inst.step();a.push(Math.round(b.air))}
  var sf={};T.sfx.forEach(function(e){sf[e.n]=(sf[e.n]||0)+1});var res={airPerSec:a.join(','),drowns:T.drown.length,sfx:sf};
  b.x=430*16+8;b.air=10;for(var k=0;k<120;k++){b.y=514;b.vy=0;inst.step()}res.pocketAir=Math.round(b.air);inst.setWater(10);for(var k=0;k<600;k++)inst.step();res.airDry=Math.round(b.air);
  inst.setBot('medica',false);inst.setBot('ing',false);inst.start();return res};

// v12: cinematica de viaje. T.travel(agua, kind, outcome, ms, from): simula 4 transiciones 1->2..4->5; mide s hasta onDone, llegada de los 3 y llamadas a onDone.
T.travel=function(water,kind,outcome,ms,from){inst.stop();inst.resetGates();inst.setWaterRate(0);var res=[];
  [[1,2],[2,3],[3,4],[4,5]].forEach(function(z){var a=z[0],to=z[1];inst.resetGates();inst.setUnlocked(a);state.round=a;inst.gather(a);['guia','medica','ing'].forEach(function(x){inst.setBot(x,x!=='guia')});inst.setLocal('guia');inst.setWater(water);inst.setWaterRate(0);for(var k=0;k<300;k++)inst.step();
    if(from==='far'){['guia','medica','ing'].forEach(function(r,i){var b=inst.bodies[r],sp=inst.world.spawns[a-1];b.x=sp.x+i*16+(a>0?500:0);b.y=sp.y})}
    var atDone='',calls=0,done=-1,t0=inst.tick,ok=inst.playTravel({toZone:to,kind:kind,outcome:outcome,ms:ms},function(){calls++;done=inst.tick-t0;var sp0=inst.world.spawns[to-1];atDone=['guia','medica','ing'].map(function(r,i){var b=inst.bodies[r];return Math.round(Math.hypot(b.x-(sp0.x+i*16),b.y-sp0.y))}).join('/')});
    var wasCs=inst.isCutscene(),unl=inst.getUnlocked(),mx=0,fadeBots=0,wr=inst.stats.warps;
    for(var k=0;k<900&&inst.isCutscene();k++){inst.step();['guia','medica','ing'].forEach(function(r){if(inst.bodies[r].warp)fadeBots++})}
    for(var k=0;k<30;k++)inst.step();
    var sp=inst.world.spawns[to-1],d=['guia','medica','ing'].map(function(r,i){var b=inst.bodies[r];return Math.round(Math.hypot(b.x-(sp.x+i*16),b.y-sp.y))}),bots=['guia','medica','ing'].map(function(r){return inst.bodies[r].bot});
    res.push({from:a,to:to,ok:ok,wasCs:wasCs,unl:unl,s:+(done/60).toFixed(1),calls:calls,atDone:atDone,dist:d,bots:bots.join(','),fadeBots:fadeBots,cam:Math.round(Math.abs(inst.cam.x-(inst.bodies.guia.x-160)))})});
  inst.start();return res};
// v13: T.travel13(kind, outcome, ms, from): como T.travel pero muestrea cada tick el cuerpo del jugador (guia): salto maximo entre fotogramas, planos (onShot), zoom, llegada de los 3. shots=[tick por plano]. caps=[ticks] -> T.frames
T.frames={};
T.travel13=function(kind,outcome,ms,caps,water){inst.stop();inst.resetGates();inst.setWaterRate(0);var res=[],R=['guia','medica','ing'];
  [[1,2],[2,3],[3,4],[4,5]].forEach(function(z){var a=z[0],to=z[1];inst.resetGates();inst.setUnlocked(a);state.round=a;inst.gather(a);R.forEach(function(x){inst.setBot(x,x!=='guia')});inst.setLocal('guia');inst.setWater(water===undefined?5:water);inst.setWaterRate(0);for(var k=0;k<300;k++)inst.step();
    var shots=[],calls=0,done=-1,t0=inst.tick,atDone='',warpsT=[],ok=inst.playTravel({toZone:to,kind:kind,outcome:outcome,ms:ms,onShot:function(i,nm){shots.push([i,nm,inst.tick-t0])}},function(){calls++;done=inst.tick-t0;var sp0=inst.world.spawns[to-1];atDone=R.map(function(r,i){var b=inst.bodies[r];return Math.round(Math.hypot(b.x-(sp0.x+i*16),b.y-sp0.y))}).join('/')});
    var g=inst.bodies.guia,px=g.x,py=g.y,mx=0,mxAt=0,camJ=0,pc={x:inst.cam.x,y:inst.cam.y},maxZ=1,fade=0,snap;
    for(var k=0;k<1200&&inst.isCutscene();k++){inst.step();var d=Math.hypot(g.x-px,g.y-py);if(d>mx){mx=d;mxAt=k}px=g.x;py=g.y;var cj=Math.hypot(inst.cam.x-pc.x,inst.cam.y-pc.y);if(cj>camJ)camJ=cj;pc={x:inst.cam.x,y:inst.cam.y};var s=inst.snapshot();if(s.cs){if(s.cs[4]>=0)fade++;if(s.cs[6]/100>maxZ)maxZ=s.cs[6]/100}
      if(caps&&caps.indexOf(k)>=0){inst.render();T.frames[kind+'_'+to+'_'+k]=document.getElementById('c').toDataURL()}}
    for(var k=0;k<30;k++)inst.step();var sp=inst.world.spawns[to-1];
    res.push({from:a,to:to,ok:ok,calls:calls,s:+(done/60).toFixed(1),shots:shots.map(function(q){return q[0]+':'+q[1]+'@'+(q[2]/60).toFixed(1)}).join(' '),atDone:atDone,dist:R.map(function(r,i){var b=inst.bodies[r];return Math.round(Math.hypot(b.x-(sp.x+i*16),b.y-sp.y))}).join('/'),maxStep:+mx.toFixed(1),maxStepAt:mxAt,camJump:+camJ.toFixed(1),fadeTicks:fade,maxZoom:maxZ,bots:R.map(function(r){return inst.bodies[r].bot?1:0}).join('')})});
  inst.start();return res};
// v15: T.cine15(kinds, waters, step): todas las transiciones x kinds x agua; por fotograma (cada `step` ticks) comprueba los 3 cuerpos dentro del recuadro visible y la luminosidad media.
T.cine15=function(kinds,waters,stp,cap){var R=['guia','medica','ing'],bad=[],minL=999,n=0,cv=document.getElementById('c'),cx=document.createElement('canvas');cx.width=cv.width;cx.height=cv.height;var g=cx.getContext('2d');inst.stop();T.frames={};
  kinds.forEach(function(kind){waters.forEach(function(w){[[1,2],[2,3],[3,4],[4,5]].forEach(function(z){var a=z[0],to=z[1];inst.resetGates();inst.setUnlocked(a);state.round=a;inst.gather(a);R.forEach(function(x){inst.setBot(x,x!=='guia')});inst.setLocal('guia');inst.setWater(w);inst.setWaterRate(0);for(var k=0;k<200;k++)inst.step();
    inst.playTravel({toZone:to,kind:kind,outcome:'bien',ms:11500},function(){});
    for(var k=0;k<1200&&inst.isCutscene();k++){inst.step();if(k%stp)continue;inst.render();n++;var s=inst.csScr();g.drawImage(cv,0,0);var d=g.getImageData(0,0,cv.width,cv.height).data,sum=0,m=0;for(var i=0;i<d.length;i+=16){sum+=d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11;m++}var L=sum/m;if(L<minL)minL=L;
